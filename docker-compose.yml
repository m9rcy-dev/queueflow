# Local development only. Never point this at a production database.
# Redis here is for local dev parity — deployed environments use Upstash
# (ADR-002 / D-06), so this container never needs to be internet-reachable.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
      POSTGRES_DB: queueflow
    ports:
      - "5432:5432"
    volumes:
      - queueflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Local email inbox (EMAIL_PROVIDER=smtp): every email the API sends —
  # login codes, invites, queue notifications — lands here instead of a real
  # inbox. View at http://localhost:8026. Ports differ from budget-terry's
  # Mailpit (1025/8025) so both projects can run at once.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  queueflow_postgres_data:
