<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QueueFlow">
  <rect width="64" height="64" rx="15" fill="#5267E8"/>
  <!-- A QR finder pattern as the bowl of the Q… -->
  <rect x="12.5" y="12.5" width="28" height="28" rx="8.5" fill="none" stroke="#fff" stroke-width="5"/>
  <rect x="21" y="21" width="11" height="11" rx="3" fill="#fff"/>
  <!-- …and a line of people flowing out as its tail. -->
  <circle cx="44" cy="44" r="3.8" fill="#fff"/>
  <circle cx="50" cy="50" r="3" fill="#fff" fill-opacity=".8"/>
  <circle cx="54.8" cy="54.8" r="2.3" fill="#fff" fill-opacity=".55"/>
</svg>
